<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 5C18 5 9 16 9 31c0 15 11 23 16 27h14c5-4 16-12 16-27C55 16 46 5 32 5Z' fill='%2338bdf8'/%3E%3Cpath d='M24 60h16l-3 4H27z' fill='%23f59e0b'/%3E%3C/svg%3E" />
    <title>云裁 BalloonFit · 热气球裁片充气验证</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 48" width="34" height="41">
              <path d="M20 2C10 2 4 10 4 20c0 11 8 17 12 21h8c4-4 12-10 12-21C36 10 30 2 20 2Z" fill="currentColor" opacity=".95"/>
              <path d="M14 42h12l-2 5h-8l-2-5Z" fill="#ffb454"/>
              <path d="M13 8c-4 5-5 13-2 22M27 8c4 5 5 13 2 22M20 4v36" stroke="#172033" stroke-width="1.4" fill="none" opacity=".55"/>
            </svg>
          </div>
          <div>
            <h1>云裁 BalloonFit</h1>
            <p>裁片 · WebGPU 膜力计算 · 充气形态与图案变形检查</p>
          </div>
        </div>
        <nav class="tabs" aria-label="工作页">
          <button class="tab active" data-page="pattern">① 裁片图案</button>
          <button class="tab" data-page="shape">② 充气形状</button>
          <button class="tab" data-page="cold">③ 冷充立起</button>
          <button class="tab" data-page="check">④ 变形检查</button>
        </nav>
        <div id="gpuBadge" class="gpu-badge pending">正在检测 WebGPU…</div>
      </header>

      <main class="app-main">
        <section id="page-pattern" class="page active"></section>
        <section id="page-shape" class="page"></section>
        <section id="page-cold" class="page"></section>
        <section id="page-check" class="page"></section>
      </main>

      <footer class="statusbar">
        <span>20 条纵向裁片 × 每条 60 块布 · 12 段/裁片 · 4 段/布块</span>
        <span id="globalStatus">计算着色器：待启动</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
